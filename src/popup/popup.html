<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Merge Requests</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-git-merge-icon lucide-git-merge"
            >
              <circle cx="18" cy="18" r="3" />
              <circle cx="6" cy="6" r="3" />
              <path d="M6 21V9a9 9 0 0 0 9 9" />
            </svg>
          </span>
          <div>
            <h1>Merge requests</h1>
            <p class="brand-sub">MR Tracker</p>
          </div>
        </div>
        <div class="header-actions">
          <select id="theme-select" class="select" aria-label="Theme"></select>
          <button
            id="mode-toggle"
            class="icon-btn"
            type="button"
            title="Theme mode (system / light / dark)"
            aria-label="Theme mode: system"
          >
            <svg
              class="mode-moon"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
            <svg
              class="mode-sun"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg
              class="mode-system"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="20" height="14" x="2" y="3" rx="2" />
              <line x1="8" x2="16" y1="21" y2="21" />
              <line x1="12" x2="12" y1="17" y2="21" />
            </svg>
          </button>
          <button
            id="sync-btn"
            type="button"
            class="btn btn-primary btn-sm"
            title="Fetch latest"
            aria-label="Fetch latest"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-refresh-ccw-icon lucide-refresh-ccw"
            >
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
            Sync
          </button>
        </div>
      </header>

      <div id="status" class="status-banner" role="status">Loading…</div>

      <section id="connect-panel" class="connect-panel" hidden>
        <div class="connect-intro">
          <h2 class="connect-heading">Connect a provider</h2>
          <p class="connect-lead">Pick GitHub, GitLab, or Bitbucket and paste a read-only token.</p>
        </div>
        <div id="connect-list" class="connect-list"></div>
        <div id="connect-form-wrap" class="connect-form-wrap" hidden>
          <button id="connect-back" type="button" class="connect-back">← All providers</button>
          <form id="connect-form" class="connect-form card"></form>
          <p id="connect-error" class="connect-error" role="alert" hidden></p>
        </div>
      </section>

      <div id="controls" class="controls" hidden>
        <select
          id="filter-project"
          class="select"
          aria-label="Project"
        ></select>
        <select id="filter-state" class="select" aria-label="State">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="merged">Merged</option>
          <option value="closed">Closed</option>
        </select>
        <button
          id="sort-btn"
          type="button"
          class="icon-btn"
          title="Sort: newest first"
          aria-label="Sort: newest first"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 8 4-4 4 4" />
            <path d="M7 4v16" />
            <path d="M11 12h4" />
            <path d="M11 16h7" />
            <path d="M11 20h10" />
          </svg>
        </button>
        <button
          id="open-all-btn"
          type="button"
          class="icon-btn"
          title="Open all in tabs"
          aria-label="Open all in tabs"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path
              d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            />
          </svg>
        </button>
      </div>

      <div id="muted-bar" class="muted-bar" hidden>
        <span id="muted-text"></span>
        <button id="unmute-btn" type="button" class="muted-clear">
          show all
        </button>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">◎</div>
        <p class="empty-title">No merge requests</p>
        <p class="empty-desc">Click Sync or check your filters in Settings.</p>
      </div>

      <div id="mr-list" class="mr-list card" hidden></div>

      <footer class="footer">
        <a id="options-link" class="footer-link" href="#">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          Settings
        </a>
        <span id="last-sync" class="footer-meta"></span>
      </footer>

      <p class="credit">crafted by Rahul KM</p>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
