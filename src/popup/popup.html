<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Merge Requests</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-git-merge-icon lucide-git-merge"
            >
              <circle cx="18" cy="18" r="3" />
              <circle cx="6" cy="6" r="3" />
              <path d="M6 21V9a9 9 0 0 0 9 9" />
            </svg>
          </span>
          <div>
            <h1>Merge requests</h1>
            <p class="brand-sub">MR Tracker</p>
          </div>
        </div>
        <button
          id="sync-btn"
          type="button"
          class="btn btn-primary btn-sm"
          title="Fetch latest"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-refresh-ccw-icon lucide-refresh-ccw"
          >
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
          Sync
        </button>
      </header>

      <div id="status" class="status-banner" role="status">Loading…</div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">◎</div>
        <p class="empty-title">No merge requests</p>
        <p class="empty-desc">Click Sync or check your filters in Settings.</p>
      </div>

      <ul id="mr-list" class="mr-list card" hidden></ul>

      <footer class="footer">
        <a id="options-link" class="footer-link" href="#">Settings</a>
        <span id="last-sync" class="footer-meta"></span>
      </footer>

      <p class="credit">crafted by Rahul KM</p>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
